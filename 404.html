<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Vibe Check</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0f172a;
            color: #fff;
            text-align: center;
            padding: 2rem;
        }
        .error-title {
            font-size: 3rem;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 1rem;
        }
        .error-subtitle {
            font-size: 1.5rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .error-btn {
            background: #60a5fa;
            color: #1e293b;
            border: none;
            padding: 1rem 2rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .error-btn:hover {
            background: #3b82f6;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-title">404</h1>
        <p class="error-subtitle">Oops! This page doesn't exist.</p>
        <a href="index.html" class="error-btn">Go Back Home</a>
    </div>
</body>
</html>
