<!-- Quiz Page (formerly mental-health-tracker/index.html) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Check - Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      // Allow access if referrer is root or index.html (GitHub Pages compatible)
      const ref = document.referrer;
      const allowed =
        ref.endsWith('/VIBE-CHECK/') ||
        ref.endsWith('/VIBE-CHECK/index.html') ||
        ref === '';
      if (!allowed) {
        window.location.replace('index.html');
      }
    </script>
</head>
<body>
    <div class="container">
        <h1>Vibe Check - Mental Wellness Quiz</h1>
        <div id="quiz-container">
            <!-- Quiz content will be injected here by script.js -->
        </div>
        <div id="gamification">
            <div id="streak"></div>
            <div id="badges"></div>
            <div id="history"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
