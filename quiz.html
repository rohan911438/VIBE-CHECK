<!-- Quiz Page (formerly mental-health-tracker/index.html) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Check - Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      // Allow access from GitHub Pages or same origin
      const ref = document.referrer;
      const { origin, pathname } = window.location;
      
      // Allow if referrer is from the same site or GitHub Pages
      const isInternal = ref.startsWith(origin);
      const isGitHubPages = ref.includes('github.io') || origin.includes('github.io');
      const isRoot = ref === `${origin}/` || ref === `${origin}/index.html` || 
                     ref === `${origin}/VIBE-CHECK/` || ref === `${origin}/VIBE-CHECK/index.html`;
      
      // Only redirect if not from valid sources and not direct access
      if (ref && !isInternal && !isGitHubPages && !isRoot) {
        window.location.replace('index.html');
      }
    </script>
</head>
<body>
    <div class="container">
        <div id="intro-screen">
            <h1><i class="fas fa-heartbeat"></i> Vibe Check</h1>
            <p class="subtitle">A quick check-in on your mental wellness.</p>
            <div class="name-input-container">
                <label for="user-name">What's your name, fam?</label>
                <input type="text" id="user-name" placeholder="Your name here...">
                <button id="start-quiz-btn">Let's Vibe!</button>
            </div>
        </div>

        <div id="quiz-screen" style="display: none;">
            <h1><i class="fas fa-heartbeat"></i> Vibe Check</h1>
            <p class="subtitle">A quick check-in on your mental wellness.</p>
            <div id="quiz-container">
                <!-- Questions will be loaded here by JavaScript -->
            </div>
            <button id="submit-btn">Get My Vibe</button>
            <div id="result-container">
                <!-- Result will be displayed here -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
